<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPad Asset Management – Hirose Indonesia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== PRIMITIVE ===== */
:root{
--brand:#003F97;--brand-hover:#00316F;--brand-soft:#E7EEF9;
--blue-50:#E7EEF9;--blue-100:#CFDDF2;--blue-500:#2F68C4;--blue-600:#003F97;--blue-700:#003F97;--cyan-500:#003F97;
--navy-900:#0E1A2E;--navy-950:#0A1322;
--slate-0:#FFFFFF;--slate-25:#F4F5F7;--slate-50:#EEF0F3;--slate-100:#DDE1E7;--slate-300:#B9C0CC;--slate-500:#7A8594;--slate-600:#55606F;--slate-700:#3A4452;--slate-900:#1A2230;
--green-50:#E8F5EE;--green-600:#1E8A55;--green-700:#17693F;--amber-50:#FFF4DD;--amber-500:#D98E04;--amber-700:#895A00;
--red-50:#FCE9E8;--red-600:#C93A33;--red-700:#9B2620;--violet-50:#EFEBF8;--violet-600:#6A4FB5;--violet-700:#523B93;
--brown-50:#F5EDE1;--brown-600:#8A6420;--brown-700:#6B4C16;
--font-sans:"IBM Plex Sans",system-ui,"Segoe UI",Roboto,sans-serif;--font-mono:"IBM Plex Mono",Consolas,monospace;
--fs-xs:12px;--fs-sm:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:19px;--fs-2xl:22px;--fs-3xl:28px;
--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;
--r-sm:3px;--r-md:5px;--r-lg:6px;--r-full:999px;
}
/* ===== SEMANTIC ===== */
:root{
--color-bg:var(--slate-25);--color-surface:#fff;--color-surface-muted:#F7F8FA;
--color-border:var(--slate-100);--color-border-strong:var(--slate-300);
--color-text:var(--slate-900);--color-text-muted:var(--slate-600);--color-text-subtle:var(--slate-500);
--color-primary:var(--brand);--color-primary-hover:var(--brand-hover);--color-primary-soft:var(--brand-soft);--color-on-primary:#fff;
--color-logo:var(--brand);
--gradient-brand:var(--brand);--gradient-side:#fff;
--color-side-text:var(--slate-700);--color-side-muted:var(--slate-500);--color-side-active:var(--brand);
--color-side-active-bg:var(--brand-soft);--color-side-hover:var(--slate-50);--color-side-border:var(--slate-100);
--s-ok-bg:var(--green-50);--s-ok-fg:var(--green-700);--s-ok-dot:var(--green-600);
--s-warn-bg:var(--amber-50);--s-warn-fg:var(--amber-700);--s-warn-dot:var(--amber-500);
--s-bad-bg:var(--red-50);--s-bad-fg:var(--red-700);--s-bad-dot:var(--red-600);
--s-info-bg:var(--blue-50);--s-info-fg:var(--blue-700);--s-info-dot:var(--blue-500);
--s-rep-bg:var(--violet-50);--s-rep-fg:var(--violet-700);--s-rep-dot:var(--violet-600);
--s-neu-bg:var(--slate-50);--s-neu-fg:var(--slate-700);--s-neu-dot:var(--slate-500);
--s-ret-bg:var(--brown-50);--s-ret-fg:var(--brown-700);--s-ret-dot:var(--brown-600);
--shadow-sm:none;--shadow-md:0 8px 24px rgba(14,26,46,.16);
--focus-ring:0 0 0 2px #fff,0 0 0 4px rgba(0,63,151,.55);--overlay:rgba(14,26,46,.5);--color-toast:#1A2230;
}
body.dark{
--color-bg:#0E131B;--color-surface:#151B25;--color-surface-muted:#1A212C;--color-border:#262F3D;--color-border-strong:#3A4658;
--color-text:#E6EAF0;--color-text-muted:#A5B0C0;--color-text-subtle:#8693A6;
--color-primary:#5B8DEF;--color-primary-hover:#7AA3F4;--color-primary-soft:rgba(91,141,239,.14);--color-on-primary:#0E131B;
--color-logo:#E6EAF0;--gradient-brand:#5B8DEF;--gradient-side:#151B25;
--color-side-text:#B7C1D0;--color-side-muted:#8693A6;--color-side-active:#fff;--color-side-active-bg:rgba(91,141,239,.16);--color-side-hover:rgba(255,255,255,.05);--color-side-border:#262F3D;
--s-ok-bg:rgba(30,138,85,.18);--s-ok-fg:#7DDBA9;--s-warn-bg:rgba(217,142,4,.18);--s-warn-fg:#F2C265;
--s-bad-bg:rgba(201,58,51,.2);--s-bad-fg:#F2A19C;--s-info-bg:rgba(91,141,239,.16);--s-info-fg:#9DBBF5;
--s-rep-bg:rgba(106,79,181,.22);--s-rep-fg:#C5B7EE;--s-neu-bg:rgba(122,133,148,.18);--s-neu-fg:#C9D1DD;--s-ret-bg:rgba(138,100,32,.24);--s-ret-fg:#EBCB92;
--toast:#222B39;--color-toast:#222B39;--focus-ring:0 0 0 2px #151B25,0 0 0 4px rgba(91,141,239,.7);
}
/* ===== COMPONENT ===== */
:root{--side-w:240px;--top-h:56px;--btn-h:38px;--input-h:40px;--card-pad:var(--sp-5)}

*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-sans);font-size:var(--fs-md);line-height:1.5;color:var(--color-text);background:var(--color-bg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--color-primary)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.005em}
.muted{color:var(--color-text-muted)}.subtle{color:var(--color-text-subtle);font-size:var(--fs-sm)}
.mono{font-family:var(--font-mono);font-size:var(--fs-xs)}
.ic{width:18px;height:18px;flex-shrink:0}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.stack{display:flex;flex-direction:column;gap:var(--sp-4)}
.row{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);flex-wrap:wrap}

/* Shell */
.shell{display:flex;min-height:100vh}
.side{width:var(--side-w);background:#fff;color:var(--color-side-text);display:flex;flex-direction:column;gap:var(--sp-1);padding:0 var(--sp-3) var(--sp-4);position:sticky;top:0;height:100vh;flex-shrink:0;z-index:20;border-right:1px solid var(--color-border)}
body.dark .side{background:var(--color-surface)}
.brand{display:flex;align-items:center;gap:var(--sp-3);height:var(--top-h);padding:0 var(--sp-2);margin:0 calc(var(--sp-3)*-1) var(--sp-3);padding-left:calc(var(--sp-3) + var(--sp-2));border-bottom:1px solid var(--color-border)}
.brand b{display:block;color:var(--color-text);font-size:var(--fs-md);font-weight:600;line-height:1.2}
.brand small{display:block;font-size:11px;color:var(--color-side-muted);letter-spacing:.02em}
.brand-t{padding-left:var(--sp-3);border-left:1px solid var(--color-border-strong);line-height:1.2}
.logo{height:26px;width:auto;color:var(--color-logo);flex-shrink:0;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:var(--sp-3);min-height:40px;padding:0 var(--sp-3);border-radius:var(--r-md);color:inherit;text-decoration:none;font-weight:500;position:relative}
.nav a:hover{background:var(--color-side-hover);color:var(--color-text)}
.nav a.on{background:var(--color-side-active-bg);color:var(--color-side-active);font-weight:600}
.nav a.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--color-primary)}
.side-foot{margin-top:auto;border-top:1px solid var(--color-side-border);padding:var(--sp-4) var(--sp-1) 0;display:flex;flex-direction:column;gap:var(--sp-2);font-size:var(--fs-xs);color:var(--color-side-muted)}
.side-foot select{background:var(--color-surface-muted);color:var(--color-text);border:1px solid var(--color-border);min-height:36px;font-size:var(--fs-sm)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:var(--top-h);background:var(--color-surface);border-bottom:1px solid var(--color-border);display:flex;align-items:center;gap:var(--sp-4);padding:0 var(--sp-6);position:sticky;top:0;z-index:15}
.gs{flex:1;max-width:440px;position:relative;color:var(--color-text-subtle)}
.gs .ic{position:absolute;left:var(--sp-3);top:50%;transform:translateY(-50%)}
.gs input{padding-left:var(--sp-10);background:var(--color-surface-muted);min-height:36px}
.top-act{margin-left:auto;display:flex;align-items:center;gap:var(--sp-1)}
.ibtn{position:relative;min-width:38px;min-height:38px;border-radius:var(--r-md);border:0;background:transparent;color:var(--color-text-muted);display:grid;place-items:center;cursor:pointer}
.ibtn:hover{background:var(--color-surface-muted);color:var(--color-text)}
.cnt{position:absolute;top:3px;right:2px;min-width:17px;height:17px;border-radius:var(--r-full);background:var(--s-bad-dot);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.avatar{width:32px;height:32px;margin-left:var(--sp-2);border-radius:var(--r-sm);background:var(--slate-900);color:#fff;display:grid;place-items:center;font-weight:600;font-size:var(--fs-xs);letter-spacing:.03em}
body.dark .avatar{background:var(--slate-700)}
.pop-wrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + var(--sp-2));width:340px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:var(--sp-2);z-index:30}
.pop a{display:block;padding:var(--sp-3);border-radius:var(--r-md);color:var(--color-text);text-decoration:none}
.pop a:hover{background:var(--color-surface-muted)}
.page{padding:var(--sp-6);width:100%;max-width:1360px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-5);padding-bottom:var(--sp-4);border-bottom:1px solid var(--color-border)}
.ph h1{font-size:var(--fs-2xl);font-weight:600}.ph p{margin:2px 0 0;color:var(--color-text-muted);font-size:var(--fs-sm)}
.crumb{font-size:var(--fs-sm);color:var(--color-text-subtle);margin-bottom:var(--sp-2)}.crumb a{text-decoration:none}.crumb a:hover{text-decoration:underline}

/* Card & grid */
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--r-lg);padding:var(--card-pad)}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.card-h h2{font-size:var(--fs-md);font-weight:600}.card-h p{margin:2px 0 0;font-size:var(--fs-sm);color:var(--color-text-muted)}
.grid{display:grid;gap:var(--sp-4)}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.mb{margin-bottom:var(--sp-5)}

/* KPI: strip menyatu */
.g4.mb{gap:0;border:1px solid var(--color-border);border-radius:var(--r-lg);background:var(--color-surface);overflow:hidden}
.g4.mb>.card{border:0;border-radius:0;border-right:1px solid var(--color-border);background:transparent}
.g4.mb>.card:last-child{border-right:0}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:var(--fs-xs);color:var(--color-text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:var(--fs-3xl);font-weight:600;line-height:1.2;font-family:var(--font-mono);letter-spacing:-.02em}
.kpi .h{font-size:var(--fs-sm);color:var(--color-text-subtle)}
.kpi.hero .v{color:var(--color-primary)}
.bar{height:6px;border-radius:var(--r-sm);background:var(--color-surface-muted);border:1px solid var(--color-border);overflow:hidden;margin-top:var(--sp-2)}
.bar i{display:block;height:100%;background:var(--color-primary)}

/* To-do */
.todo{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);border:1px solid var(--color-border);border-radius:var(--r-md);margin-bottom:var(--sp-2);min-height:52px}
.todo:hover{background:var(--color-surface-muted)}
.todo .n{min-width:36px;height:36px;border-radius:var(--r-sm);display:grid;place-items:center;font-weight:600;font-size:var(--fs-md);font-family:var(--font-mono)}
.todo .t{flex:1;min-width:0}.todo .t b{display:block;font-weight:600}.todo .t small{color:var(--color-text-subtle);font-size:var(--fs-xs)}

/* Tones */
.tone-ok{background:var(--s-ok-bg);color:var(--s-ok-fg);--d:var(--s-ok-dot)}
.tone-warn{background:var(--s-warn-bg);color:var(--s-warn-fg);--d:var(--s-warn-dot)}
.tone-bad{background:var(--s-bad-bg);color:var(--s-bad-fg);--d:var(--s-bad-dot)}
.tone-info{background:var(--s-info-bg);color:var(--s-info-fg);--d:var(--s-info-dot)}
.tone-rep{background:var(--s-rep-bg);color:var(--s-rep-fg);--d:var(--s-rep-dot)}
.tone-neu{background:var(--s-neu-bg);color:var(--s-neu-fg);--d:var(--s-neu-dot)}
.tone-ret{background:var(--s-ret-bg);color:var(--s-ret-fg);--d:var(--s-ret-dot)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:1px 8px 1px 7px;border-radius:var(--r-sm);font-size:var(--fs-xs);font-weight:600;line-height:20px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:1px;background:var(--d,currentColor)}
.badge.plain::before{display:none}

/* Horizontal bars */
.hb{display:grid;grid-template-columns:120px 1fr 32px;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3);font-size:var(--fs-sm)}
.hb-track{height:8px;border-radius:var(--r-sm);background:var(--color-surface-muted);overflow:hidden}
.hb-track i{display:block;height:100%;background:var(--d,var(--color-primary))}
.hb-track i.brand{background:var(--color-primary)}
.hb b{text-align:right;font-family:var(--font-mono);font-weight:500}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:var(--btn-h);padding:0 var(--sp-4);border-radius:var(--r-md);border:1px solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:inherit;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:var(--color-primary-hover);border-color:var(--color-primary-hover)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-sec{background:var(--color-surface);color:var(--color-text);border-color:var(--color-border-strong)}
.btn-sec:hover:not(:disabled){background:var(--color-surface-muted);border-color:var(--slate-500)}
.btn-soft{background:var(--color-primary-soft);color:var(--color-primary);border-color:transparent}
.btn-soft:hover:not(:disabled){background:var(--color-primary-soft);border-color:var(--color-primary)}
.btn-ok{background:var(--s-ok-dot);border-color:var(--s-ok-dot);color:#fff}.btn-ok:hover:not(:disabled){background:var(--s-ok-fg);border-color:var(--s-ok-fg)}
.btn-bad{background:var(--s-bad-dot);border-color:var(--s-bad-dot);color:#fff}.btn-bad:hover:not(:disabled){background:var(--s-bad-fg)}
.btn-link{background:transparent;border-color:transparent;color:var(--color-primary);padding:0 var(--sp-2)}.btn-link:hover:not(:disabled){background:transparent;border-color:transparent;text-decoration:underline}
.btn-sm{min-height:32px;padding:0 var(--sp-3);font-size:var(--fs-sm);border-radius:var(--r-sm)}
.btn-block{width:100%}
.seg{display:inline-flex;border:1px solid var(--color-border-strong);border-radius:var(--r-md);overflow:hidden}
.seg button{border:0;background:var(--color-surface);color:var(--color-text-muted);min-height:34px;min-width:38px;display:grid;place-items:center;cursor:pointer}
.seg button+button{border-left:1px solid var(--color-border-strong)}
.seg button.on{background:var(--color-primary-soft);color:var(--color-primary)}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:var(--fs-sm);font-weight:600}
.field .hint{font-size:var(--fs-xs);color:var(--color-text-subtle)}
.field .err{font-size:var(--fs-xs);color:var(--s-bad-fg);font-weight:600}
input,select,textarea{font:inherit;color:var(--color-text);background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--r-md);min-height:var(--input-h);padding:0 var(--sp-3);width:100%}
textarea{padding:var(--sp-2) var(--sp-3);min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--color-primary);box-shadow:var(--focus-ring)}
input[type=checkbox]{width:16px;height:16px;min-height:0;accent-color:var(--color-primary);cursor:pointer}
.ro{min-height:var(--input-h);display:flex;align-items:center;padding:0 var(--sp-3);border-radius:var(--r-md);background:var(--color-surface-muted);border:1px solid var(--color-border)}
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:var(--sp-3);margin-bottom:var(--sp-4)}

/* Tabs */
.tabs{display:flex;gap:var(--sp-5);border-bottom:1px solid var(--color-border);margin-bottom:var(--sp-5);overflow-x:auto}
.tabs a,.tabs button{min-height:42px;padding:0 2px;display:flex;align-items:center;gap:var(--sp-2);border:0;background:none;font:inherit;font-weight:500;color:var(--color-text-muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tabs a:hover,.tabs button:hover{color:var(--color-text)}
.tabs .on{color:var(--color-primary);border-bottom-color:var(--color-primary);font-weight:600}
.chips{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-4)}
.chip{min-height:32px;padding:0 var(--sp-3);border-radius:var(--r-sm);border:1px solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text-muted);font:inherit;font-size:var(--fs-sm);font-weight:500;cursor:pointer}
.chip:hover{border-color:var(--slate-500)}
.chip.on{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-primary)}

/* Table */
.tw{overflow-x:auto;border:1px solid var(--color-border);border-radius:var(--r-md)}
table{width:100%;border-collapse:collapse}
th{background:var(--color-surface-muted);font-size:11px;font-weight:600;color:var(--color-text-muted);text-align:left;padding:var(--sp-2) var(--sp-4);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
td{padding:10px var(--sp-4);border-top:1px solid var(--color-border);vertical-align:middle}
tbody tr:hover td{background:var(--color-surface-muted)}
td .sub{display:block;font-size:var(--fs-xs);color:var(--color-text-subtle)}
.bulk{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;padding:var(--sp-2) var(--sp-4);margin-bottom:var(--sp-3);border-radius:var(--r-md);background:var(--color-primary-soft);border:1px solid var(--color-primary)}

/* Device cards */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--sp-3)}
.dcard{border:1px solid var(--color-border);border-radius:var(--r-lg);padding:var(--sp-4);background:var(--color-surface);display:flex;flex-direction:column;gap:var(--sp-2)}
.dcard:hover{border-color:var(--color-primary)}
.dl{display:grid;grid-template-columns:150px 1fr;gap:var(--sp-3) var(--sp-4);margin:0}
.dl dt{color:var(--color-text-muted);font-size:var(--fs-sm)}.dl dd{margin:0;font-weight:500}

/* Notes */
.note{padding:var(--sp-3) var(--sp-4);border-radius:var(--r-sm);border-left:3px solid var(--d);font-size:var(--fs-sm);color:var(--color-text);margin-bottom:var(--sp-4)}
.note.tone-warn,.note.tone-info,.note.tone-bad,.note.tone-ok{color:var(--color-text)}
.empty{text-align:center;padding:var(--sp-10) var(--sp-4);color:var(--color-text-muted)}
.empty b{display:block;color:var(--color-text);font-size:var(--fs-md);margin-bottom:var(--sp-1)}

/* Wizard */
.wsteps{display:flex;gap:0;margin-bottom:var(--sp-6);border:1px solid var(--color-border);border-radius:var(--r-md);overflow:hidden}
.ws{flex:1;min-width:150px;display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);color:var(--color-text-muted);font-weight:500;border-right:1px solid var(--color-border)}
.ws:last-child{border-right:0}

function qr(text,size=96){
 let h=2166136261;for(const c of text){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}
 const n=21,c=size/n;let r='';
 const fin=(x,y)=>`<rect x="${(x+.5)*c}" y="${(y+.5)*c}" width="${6*c}" height="${6*c}" fill="none" stroke="currentColor" stroke-width="${c}"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="currentColor"/>`;
 const inF=(x,y)=>(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(inF(x,y))continue;h=(Math.imul(h,1103515245)+12345)>>>0;if(h&0x10000)r+=`<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}"/>`}
 return `<span class="qr"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="currentColor" role="img" aria-label="QR ${esc(text)} (ilustrasi)">${r}${fin(0,0)}${fin(14,0)}${fin(0,14)}</svg></span>`;

function passErr(v,id){
 if(!/^\d{6}$/.test(v))return 'Harus 6 digit angka.';
 if(v==='123456')return 'Tidak boleh 123456.';
 if(/^(\d)\1{5}$/.test(v))return 'Tidak boleh angka yang sama berulang.';
 if('0123456789'.includes(v)||'9876543210'.includes(v))return 'Tidak boleh angka berurutan.';
 if(D.ipads.some(x=>x.id!==id&&pc(x)===v))return 'Passcode sudah dipakai iPad lain.';
 return '';
}
function guidesFor(p){return GUIDES.filter(g=>condOk(g.cond,p)).map(g=>Object.assign({},g,{steps:g.steps.filter(s=>condOk(s.cond,p))})).filter(g=>g.steps.length)}
function resolveVar(name,p,lama){
 const lok=lama?(p.fromLokasi||p.lok):p.lok,un=lama?(p.fromUntuk||p.untuk):p.untuk,c=D.vars.filter(v=>v.name===name);
 return c.find(v=>v.scope==='lokasi+peruntukan'&&v.lok===lok&&v.untuk===un)||c.find(v=>v.scope==='lokasi'&&v.lok===lok)||c.find(v=>v.scope==='peruntukan'&&v.untuk===un)||c.find(v=>v.scope==='umum');
}
function rt(text,p){
 const f=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\{\{([\w:]+)\}\}/g,(m,v)=>{const k=v.replace(':lama','');if(SYSV[k])return `<span class="sysv">${esc(SYSV[k](p))}</span>`;const d=VARDEFS.find(x=>x.k===k),r=resolveVar(k,p,v.endsWith(':lama'));return `<button class="var" onclick="A.var('${v}','${p.id}')">${ic(d&&d.secret?'lock':'qr')}${r?(d&&d.secret?'••••••':esc(r.val)):'⚠ '+k+' belum diatur'}</button>`});
 const L=String(text).split('\n');return f(L[0])+L.slice(1).map(x=>`<span class="subl">${f(x)}</span>`).join('');
}
const cfgInit=id=>{const st=S.cfg[id]=S.cfg[id]||{};st.s=st.s||{};st.g=st.g||{};st.v=st.v||{};return st};
const curVal=(p,f)=>({ios:p.ios,wifi:p.wifi,ip:p.ip,appleStatus:p.apple,irepUser:p.irepUser,conmasId:p.conmasId,note:p.note})[f.target]||'';
const fval=(p,f,st)=>st.v[f.k]??(f.target==='wifi'?(p.wifi||(resolveVar('wifi_ssid',p)||{}).val||''):curVal(p,f));
const canDone=(p,g,st)=>g.steps.every(s=>st.s[s.id])&&g.fields.every(f=>!f.req||(f.target==='passcode'?(!!st.v.passcode||!p.passDefault):!!fval(p,f,st)));

 const cur=Math.min(S.cfgCur[id]??0,G.length-1),g=G[cur],gd=!!st.g[g.id],doneN=G.filter(x=>st.g[x.id]).length,left=G.filter(x=>x.req&&!st.g[x.id]).length,fin=!left&&!p.passDefault;

 return head(`Konfigurasi ${p.name}`,`${p.scn==='reset'?'Reset (pindah tempat)'+(p.fromLokasi?' dari '+p.fromLokasi:''):'iPad baru'} · ${p.lok} · ${esc(p.sec)} · ${p.untuk}`,`<span class="subtle">${p.prog}% selesai</span><button class="btn btn-ok" ${fin?'':'disabled'} onclick="A.cfgFinish('${id}')" title="${fin?'':'Selesaikan semua item wajib & ganti passcode dulu'}">${ic('check')}Selesai, iPad siap dipakai</button>`,`<a href="#/registrasi/persetujuan">Registrasi</a> › Konfigurasi`)+

 <div class="cfg"><div class="card" style="padding:var(--sp-3)"><p class="subtle" style="margin:0 var(--sp-2) var(--sp-2)">${doneN} dari ${G.length} item selesai · ${left?left+' wajib tersisa':'semua wajib selesai ✓'}</p><nav class="cfgl" aria-label="Checklist panduan">${G.map((x,i)=>`<button class="${i===cur?'cur':''}" onclick="A.cfgGo('${id}',${i})"><span class="dot ${st.g[x.id]?'ok':''}">${st.g[x.id]?ic('check'):''}</span><span>${esc(x.t)}${x.req?'':' <span class="subtle">· opsional</span>'}</span></button>`).join('')}</nav>${p.passDefault?'<div class="note tone-warn" style="margin-top:var(--sp-3)">Passcode masih 123456, wajib diganti sebelum selesai.</div>':''}<a class="btn btn-sec btn-block" style="margin-top:var(--sp-3)" href="#/registrasi/persetujuan">Simpan &amp; lanjut nanti</a></div>
 <div class="card"><div class="card-h"><div><span class="subtle">Item ${cur+1} dari ${G.length}</span><h2 style="font-size:var(--fs-xl)">${esc(g.t)}</h2></div><div class="row">${gd?badge('Selesai'):''}${can('cfgSettings')?`<button class="btn btn-sm btn-sec" onclick="A.editGuide('${g.id}')">Edit panduan ini</button>`:''}</div></div>
 ${g.descr?`<p>${rt(g.descr,p)}</p>`:''}
 <ol class="steps">${g.steps.map(stepRow).join('')}</ol>

 <div class="spread"><button class="btn btn-sec" ${cur===0?'disabled':''} onclick="A.cfgGo('${id}',${cur-1})">Sebelumnya</button>
 <div class="row">${gd?`<button class="btn btn-sec" onclick="A.cfgUndo('${id}')">Batalkan tanda selesai</button>${cur<G.length-1?`<button class="btn" onclick="A.cfgGo('${id}',${cur+1})">Berikutnya</button>`:''}`:`${!g.req&&cur<G.length-1?`<button class="btn btn-sec" onclick="A.cfgGo('${id}',${cur+1})">Lewati</button>`:''}<button class="btn" id="cfg-done" ${canDone(p,g,st)?'':'disabled'} onclick="A.guideDone('${id}')">${ic('check')}Tandai selesai &amp; lanjut</button>`}</div></div>

/* CSV: UTF-8 BOM + pemisah ';' (cocok Excel regional Indonesia) + anti formula injection */
function toCsv(rows){
 const q=v=>{if(typeof v==='number')return String(v);v=String(v??'');
  if(v.length>1&&/^[=+\-@\t\r]/.test(v))v="'"+v;
  return /[";\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 return '\uFEFF'+rows.map(r=>r.map(q).join(';')).join('\r\n');
}

/* XLSX: Office Open XML + ZIP (store) tanpa library */
const xe=v=>String(v??'').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const colL=i=>{let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};

function zip(files,type){
 const enc=new TextEncoder(),parts=[],central=[];let off=0;
 const d=new Date(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
 for(const f of files){
  const name=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
  const h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
  h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);
  h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
  parts.push(new Uint8Array(h.buffer),name,data);
  const c=new DataView(new ArrayBuffer(46));
  c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);
  c.setUint16(10,0,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);c.setUint32(16,crc,true);
  c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
  central.push(new Uint8Array(c.buffer),name);
  off+=30+name.length+data.length;
 }
 const size=central.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);
 e.setUint32(12,size,true);e.setUint32(16,off,true);
 return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type});
}

function toXlsx(sheet,cols,body){

 const argb=v=>'FF'+(css.getPropertyValue(v).trim()||'#1E40AF').replace('#','').toUpperCase();
 const cell=(v,r,c,s)=>{const ref=colL(c)+r,st=s?` s="${s}"`:'';
  return typeof v==='number'&&isFinite(v)?`<c r="${ref}"${st}><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xe(v)}</t></is></c>`};
 const rows=[cols.map(c=>c[0]),...body].map((r,i)=>`<row r="${i+1}">${r.map((v,j)=>cell(v,i+1,j,i?0:1)).join('')}</row>`).join('');
 const NS='http://schemas.openxmlformats.org',X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
 return zip([
  {name:'[Content_Types].xml',data:`${X}<Types xmlns="${NS}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},
  {name:'_rels/.rels',data:`${X}<Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
  {name:'xl/workbook.xml',data:`${X}<workbook xmlns="${NS}/spreadsheetml/2006/main" xmlns:r="${NS}/officeDocument/2006/relationships"><sheets><sheet name="${xe(sn)}" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">'${xe(sn.replace(/'/g,"''"))}'!$A$1:$${lastC}$${n}</definedName></definedNames></workbook>`},
  {name:'xl/_rels/workbook.xml.rels',data:`${X}<Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${NS}/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
  {name:'xl/styles.xml',data:`${X}<styleSheet xmlns="${NS}/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="${argb('--slate-0')}"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="${argb('--blue-700')}"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},
  {name:'xl/worksheets/sheet1.xml',data:`${X}<worksheet xmlns="${NS}/spreadsheetml/2006/main"><sheetViews><sheetView tabSelected="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${cols.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${c[2]||14}" customWidth="1"/>`).join('')}</cols><sheetData>${rows}</sheetData><autoFilter ref="A1:${lastC}${n}"/></worksheet>`}
 ],'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');

const ROUTES=[[/^#\/(dashboard)?$/,()=>pDash()],[/^#\/monitoring(?:\/(\w+))?$/,pMon],[/^#\/ipad\/(\w+)(?:\/(\w+))?$/,pDetail],[/^#\/registrasi(?:\/(\w+))?$/,pReg],[/^#\/konfigurasi\/(\w+)$/,pCfg],[/^#\/lapor(?:\?.*)?$/,pLapor],[/^#\/pengaturan(?:\/(\w+))?$/,pSet],[/^#\/akun$/,pAkun]];
function render(){
 document.body.classList.toggle('dark',S.dark);
 const app=$('#app');
 if(!S.auth){app.innerHTML=pLogin();return}
 const h=location.hash||'#/dashboard';
 for(const [re,fn] of ROUTES){const m=h.match(re);if(m){app.innerHTML=shell(fn(...m.slice(1)),h);return}}
 app.innerHTML=shell(p404(),h);
}

 var(name,id,show){const p=byId(id),lama=name.endsWith(':lama'),k=name.replace(':lama',''),d=VARDEFS.find(x=>x.k===k),v=resolveVar(k,p,lama),hid=d&&d.secret&&!show;if(show)log('Membuka variabel rahasia',p.name+' · '+k);modal('Variabel {{'+esc(name)+'}}',v?`<div style="text-align:center">${hid?`<p class="mono" style="font-size:var(--fs-lg)">••••••••</p><button class="btn" onclick="A.var('${name}','${id}',1)">${ic('eye')}Tampilkan (tercatat di audit)</button>`:`${qr(v.val,160)}<p class="mono" style="font-size:var(--fs-lg);margin:var(--sp-3) 0 var(--sp-1)">${esc(v.val)}</p>`}<p class="subtle">${esc(d?d.label:k)} · cakupan: ${v.scope}${lama?' · lokasi sebelumnya ('+esc(p.fromLokasi||p.lok)+')':''}</p></div>`:'<div class="empty"><b>Nilai belum diatur</b>Atur di Pengaturan › Variabel.</div>',`<button class="btn" onclick="A.close()">Tutup</button>`)},
